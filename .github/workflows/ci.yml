name: CI
on: [push, pull_request]

jobs:
  verify-posix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: claritycrm
          POSTGRES_PASSWORD: clarity-ci-password
          POSTGRES_DB: claritycrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U claritycrm -d claritycrm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://claritycrm:clarity-ci-password@127.0.0.1:5432/claritycrm
      CLARITY_ADMIN_EMAIL: admin@clarity.test
      CLARITY_ADMIN_PASSWORD: CI-password-2026-strong
      CLARITY_COOKIE_SECURE: "0"
      CLARITY_AUTOMATION_WORKER_TOKEN: clarity-ci-worker-token-0123456789abcdef
      CLARITY_WEBHOOK_MASTER_SECRET: clarity-ci-master-secret-0123456789abcdef
      CLARITY_WEBHOOK_ALLOW_PRIVATE_E2E: "1"
      PORT: "5173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate operational scripts
        run: |
          test -x scripts/deploy-posix-vm.sh
          test -x scripts/migrate-postgres.mjs
          test -x scripts/bootstrap-admin.mjs
          test -x scripts/ci-e2e-posix.sh
          test -x scripts/ci-e2e-v03-configuration-postgres.sh
          test -x scripts/ci-e2e-automation-queue-postgres.sh
          test -f scripts/ci-e2e-v11-postgres.sh
          test -f scripts/ci-upgrade-v03-to-v11-postgres.sh
          test -f scripts/ci-e2e-v11-module-state.sh
          test -f scripts/ci-e2e-v11-sla-reminder.sh
          test -x scripts/ci-backup-restore-postgres.sh
          test -x scripts/migrate-legacy-d1.mjs
          test -x scripts/ci-legacy-d1-migration.sh
          test -x scripts/upgrade-legacy-d1-posix.sh
          test -d legacy/d1/drizzle
          test ! -e drizzle/meta/_journal.json
          bash -n scripts/deploy-posix-vm.sh
          bash -n scripts/ci-e2e-posix.sh
          bash -n scripts/ci-e2e-v03-configuration-postgres.sh
          bash -n scripts/ci-e2e-automation-queue-postgres.sh
          bash -n scripts/ci-e2e-v11-postgres.sh
          bash -n scripts/ci-upgrade-v03-to-v11-postgres.sh
          bash -n scripts/ci-e2e-v11-module-state.sh
          bash -n scripts/ci-e2e-v11-sla-reminder.sh
          bash -n scripts/ci-backup-restore-postgres.sh
          bash -n scripts/ci-legacy-d1-migration.sh
          bash -n scripts/upgrade-legacy-d1-posix.sh
          node --check scripts/migrate-legacy-d1.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NODE_ENV: production
      - name: Validate v0.3 to v1.1 PostgreSQL upgrade
        run: bash scripts/ci-upgrade-v03-to-v11-postgres.sh
      - run: npm run db:migrate
      - run: npm run bootstrap:admin
      - run: bash scripts/ci-e2e-posix.sh
        env:
          NODE_ENV: production
      - name: Validate v0.3 configurable engine on PostgreSQL
        run: bash scripts/ci-e2e-v03-configuration-postgres.sh
        env:
          NODE_ENV: production
      - name: Validate PostgreSQL automation queue and webhooks
        run: bash scripts/ci-e2e-automation-queue-postgres.sh
        env:
          NODE_ENV: production
      - name: Validate v1.1 template state restoration
        run: bash scripts/ci-e2e-v11-module-state.sh
        env:
          NODE_ENV: production
      - name: Validate v1.1 on PostgreSQL
        run: |
          PG17_BIN="$(mktemp -d)"
          cat >"$PG17_BIN/pg_dump" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          container="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:17([@:]|$)/ { print $1; exit }')"
          [[ -n "$container" ]] || { echo "PostgreSQL 17 service container not found" >&2; exit 1; }
          exec docker exec -i "$container" pg_dump "$@"
          EOF
          cat >"$PG17_BIN/pg_restore" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          container="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:17([@:]|$)/ { print $1; exit }')"
          [[ -n "$container" ]] || { echo "PostgreSQL 17 service container not found" >&2; exit 1; }
          if (( $# > 0 )); then
            dump_file="${!#}"
            if [[ -f "$dump_file" ]]; then
              args=("${@:1:$#-1}")
              exec docker exec -i "$container" pg_restore "${args[@]}" <"$dump_file"
            fi
          fi
          exec docker exec -i "$container" pg_restore "$@"
          EOF
          chmod 0755 "$PG17_BIN/pg_dump" "$PG17_BIN/pg_restore"
          export PATH="$PG17_BIN:$PATH"
          bash -E -c '
            trap '\''rc=$?; echo "[V1.1][ASSERT] line=$LINENO code=$rc" >&2'\'' ERR
            source scripts/ci-e2e-v11-postgres.sh
          '
        env:
          NODE_ENV: production
          CLARITY_DOCUMENTS_DIR: /tmp/clarity-crm-v11-documents
      - name: Validate v1.1 SLA reminders
        run: bash scripts/ci-e2e-v11-sla-reminder.sh
        env:
          NODE_ENV: production
      - name: Validate legacy D1 to PostgreSQL migration
        run: bash scripts/ci-legacy-d1-migration.sh
      - name: Validate PostgreSQL backup and restore
        run: bash scripts/ci-backup-restore-postgres.sh