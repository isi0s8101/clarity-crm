name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: bash scripts/ci-e2e-foundations.sh
      - run: bash scripts/ci-e2e-v1.sh
      - run: bash scripts/ci-e2e-v1-extensions.sh
